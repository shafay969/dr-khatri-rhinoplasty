name: SEO build and regression checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out proposed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked project dependencies
        run: npm ci
      - name: Install Chromium for local rendering checks
        run: npx playwright install --with-deps chromium
      - name: Test monitoring logic without the network
        run: python3 scripts/test_seo_monitor.py
      - name: Build static production pages
        run: npm run build
      - name: Check routes, metadata and consultation navigation
        run: npm run test:seo
