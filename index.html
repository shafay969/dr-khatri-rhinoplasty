    <!--
      Per-route title/description/OG/canonical/JSON-LD are injected by
      react-helmet-async (see src/components/layout/SEO.tsx) once React
      mounts. These are intentionally NOT duplicated here — a static tag
      here can't be removed by Helmet, so it would silently win over the
      per-page one for any crawler that doesn't execute JS (social link
      unfurlers especially). Keep this file to only what's genuinely
      global and route-independent.
    -->
    <title>Dr. Vijay Khatri — Rhinoplasty Surgeon, Karachi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
