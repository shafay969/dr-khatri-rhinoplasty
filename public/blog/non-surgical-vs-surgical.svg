<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Diagram comparing temporary filler injection with permanent structural rhinoplasty">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A424C"/>
      <stop offset="50%" stop-color="#16283D"/>
      <stop offset="100%" stop-color="#1F332E"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#0A121C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A121C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.5"/>
  <circle cx="1300" cy="190" r="220" fill="#6C8C82" opacity="0.14" filter="url(#glow)"/>
  <circle cx="220" cy="730" r="190" fill="#E3B8BF" opacity="0.12" filter="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M56,96 L56,56 L96,56"/>
    <path d="M1504,56 L1544,56 L1544,96"/>
    <path d="M56,804 L56,844 L96,844"/>
    <path d="M1544,804 L1544,844 L1504,844"/>
  </g>

  <!-- Left: filler syringe — temporary, additive -->
  <g stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="3" fill="none" stroke-linejoin="round">
    <rect x="425" y="330" width="70" height="15" rx="4"/>
    <line x1="460" y1="345" x2="460" y2="381"/>
    <rect x="445" y="379" width="30" height="14" rx="2"/>
    <rect x="440" y="393" width="40" height="140" rx="5"/>
    <path d="M440,533 L480,533 L467,555 L453,555 Z"/>
    <line x1="460" y1="555" x2="460" y2="612" stroke-width="2.5"/>
  </g>
  <rect x="443" y="472" width="34" height="55" rx="2" fill="#E3B8BF" opacity="0.4"/>
  <g fill="none" stroke="#E3B8BF" stroke-dasharray="3 4">
    <circle cx="460" cy="636" r="7" opacity="0.5" stroke-width="2"/>
    <circle cx="460" cy="662" r="5" opacity="0.32" stroke-width="2"/>
    <circle cx="460" cy="683" r="3" opacity="0.18" stroke-width="2"/>
  </g>

  <!-- Right: structural profile with reinforcement grafts — permanent, corrective -->
  <g transform="translate(1030,150) scale(2.9)">
    <path d="M60,20 Q85,50 90,85 Q93,100 93,110 L108,125 L93,128 Q95,145 90,165 Q85,185 80,210"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.94" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#E3B8BF" stroke-width="1.7" stroke-linecap="round">
      <line x1="90" y1="85" x2="70" y2="76" opacity="0.85"/>
      <circle cx="90" cy="85" r="2.6" fill="#E3B8BF" stroke="none"/>
      <circle cx="70" cy="76" r="2.6" fill="#E3B8BF" stroke="none"/>
      <line x1="93" y1="110" x2="70" y2="112" opacity="0.85"/>
      <circle cx="93" cy="110" r="2.6" fill="#E3B8BF" stroke="none"/>
      <circle cx="70" cy="112" r="2.6" fill="#E3B8BF" stroke="none"/>
    </g>
    <circle cx="93" cy="110" r="46" fill="none" stroke="#E3B8BF" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.28"/>
  </g>

  <!-- Divider + comparison handle, echoing the before/after slider -->
  <line x1="800" y1="130" x2="800" y2="770" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="800" cy="450" r="40" fill="#33544C" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M786,438 L770,450 L786,462"/>
    <path d="M814,438 L830,450 L814,462"/>
  </g>
</svg>
