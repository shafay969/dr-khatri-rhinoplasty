<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Illustration of a consultation checklist for questions to ask before rhinoplasty">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B06A76"/>
      <stop offset="50%" stop-color="#1F332E"/>
      <stop offset="100%" stop-color="#16283D"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#0A121C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A121C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.5"/>
  <circle cx="1300" cy="200" r="220" fill="#E3B8BF" opacity="0.12" filter="url(#glow)"/>
  <circle cx="200" cy="720" r="190" fill="#0A121C" opacity="0.24" filter="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M56,96 L56,56 L96,56"/>
    <path d="M1504,56 L1544,56 L1544,96"/>
    <path d="M56,804 L56,844 L96,844"/>
    <path d="M1544,804 L1544,844 L1504,844"/>
  </g>

  <!-- Faint profile watermark, shared motif with homepage hero -->
  <g transform="translate(870,150) scale(3.3)" opacity="0.12">
    <path d="M60,20 Q85,50 90,85 Q93,100 93,110 L108,125 L93,128 Q95,145 90,165 Q85,185 80,210"
          fill="none" stroke="#FFFFFF" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Consultation checklist card -->
  <rect x="640" y="255" width="320" height="410" rx="26" fill="#16283D" fill-opacity="0.22" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3"/>
  <rect x="750" y="238" width="100" height="26" rx="9" fill="#16283D" fill-opacity="0.3" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3"/>

  <g stroke-linecap="round">
    <!-- Row 1: answered -->
    <circle cx="700" cy="345" r="15" fill="none" stroke="#E3B8BF" stroke-width="3"/>
    <path d="M693,345 L698,351 L709,338" fill="none" stroke="#E3B8BF" stroke-width="3" stroke-linejoin="round"/>
    <line x1="732" y1="345" x2="912" y2="345" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6"/>

    <!-- Row 2: answered -->
    <circle cx="700" cy="418" r="15" fill="none" stroke="#E3B8BF" stroke-width="3"/>
    <path d="M693,418 L698,424 L709,411" fill="none" stroke="#E3B8BF" stroke-width="3" stroke-linejoin="round"/>
    <line x1="732" y1="418" x2="880" y2="418" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6"/>

    <!-- Row 3: pending -->
    <circle cx="700" cy="491" r="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"/>
    <line x1="732" y1="491" x2="895" y2="491" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6"/>

    <!-- Row 4: pending -->
    <circle cx="700" cy="564" r="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"/>
    <line x1="732" y1="564" x2="860" y2="564" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="6"/>
  </g>
</svg>
