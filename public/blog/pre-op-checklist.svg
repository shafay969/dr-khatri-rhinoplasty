<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Line-art diagram of a pre-surgery checklist beside a nasal profile silhouette">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F332E"/>
      <stop offset="55%" stop-color="#7A424C"/>
      <stop offset="100%" stop-color="#16283D"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="52%" r="58%">
      <stop offset="0%" stop-color="#0A121C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A121C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.5"/>
  <circle cx="1290" cy="180" r="230" fill="#6C8C82" opacity="0.16" filter="url(#glow)"/>
  <circle cx="230" cy="750" r="190" fill="#E3B8BF" opacity="0.14" filter="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M56,96 L56,56 L96,56"/>
    <path d="M1504,56 L1544,56 L1544,96"/>
    <path d="M56,804 L56,844 L96,844"/>
    <path d="M1544,804 L1544,844 L1504,844"/>
  </g>

  <!-- Profile silhouette, shared motif with homepage hero -->
  <g transform="translate(420,110) scale(3.1)">
    <path d="M60,20 Q85,50 90,85 Q93,100 93,110 L108,125 L93,128 Q95,145 90,165 Q85,185 80,210"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Checklist motif: boxes with checkmarks and rule lines -->
  <g transform="translate(950,220)">
    <g stroke="#E3B8BF" stroke-opacity="0.7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="30" height="30" rx="6" opacity="0.5"/>
      <path d="M6,15 L13,22 L25,7" opacity="0.95"/>
    </g>
    <line x1="46" y1="15" x2="400" y2="15" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>

    <g transform="translate(0,80)" stroke="#E3B8BF" stroke-opacity="0.7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="30" height="30" rx="6" opacity="0.5"/>
      <path d="M6,15 L13,22 L25,7" opacity="0.95"/>
    </g>
    <line x1="46" y1="95" x2="360" y2="95" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>

    <g transform="translate(0,160)" stroke="#E3B8BF" stroke-opacity="0.35" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="30" height="30" rx="6" opacity="0.5"/>
    </g>
    <line x1="46" y1="175" x2="380" y2="175" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>

    <g transform="translate(0,240)" stroke="#E3B8BF" stroke-opacity="0.35" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="30" height="30" rx="6" opacity="0.5"/>
    </g>
    <line x1="46" y1="255" x2="340" y2="255" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
  </g>
</svg>
