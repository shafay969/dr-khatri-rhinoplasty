<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Line-art diagram of an itemized cost breakdown beside a nasal profile silhouette">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16283D"/>
      <stop offset="55%" stop-color="#1F332E"/>
      <stop offset="100%" stop-color="#7A424C"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="52%" r="58%">
      <stop offset="0%" stop-color="#0A121C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A121C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.5"/>
  <circle cx="1290" cy="180" r="230" fill="#E3B8BF" opacity="0.12" filter="url(#glow)"/>
  <circle cx="230" cy="750" r="190" fill="#33544C" opacity="0.26" filter="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M56,96 L56,56 L96,56"/>
    <path d="M1504,56 L1544,56 L1544,96"/>
    <path d="M56,804 L56,844 L96,844"/>
    <path d="M1544,804 L1544,844 L1504,844"/>
  </g>

  <!-- Profile silhouette, shared motif with homepage hero -->
  <g transform="translate(430,110) scale(3.1)">
    <path d="M60,20 Q85,50 90,85 Q93,100 93,110 L108,125 L93,128 Q95,145 90,165 Q85,185 80,210"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Itemized ledger motif: line items with a running total, evoking a transparent cost breakdown -->
  <g transform="translate(940,230)" font-family="Georgia, serif">
    <line x1="0" y1="0" x2="430" y2="0" stroke="#E3B8BF" stroke-opacity="0.35" stroke-width="1.5"/>
    <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round">
      <line x1="0" y1="70" x2="430" y2="70"/>
      <line x1="0" y1="140" x2="430" y2="140"/>
      <line x1="0" y1="210" x2="430" y2="210"/>
      <line x1="0" y1="280" x2="430" y2="280"/>
    </g>
    <circle cx="8" cy="70" r="4" fill="#E3B8BF" opacity="0.8"/>
    <circle cx="8" cy="140" r="4" fill="#E3B8BF" opacity="0.8"/>
    <circle cx="8" cy="210" r="4" fill="#E3B8BF" opacity="0.8"/>
    <circle cx="8" cy="280" r="4" fill="#E3B8BF" opacity="0.8"/>
    <line x1="330" y1="55" x2="410" y2="55" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2"/>
    <line x1="350" y1="125" x2="410" y2="125" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2"/>
    <line x1="320" y1="195" x2="410" y2="195" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2"/>
    <line x1="360" y1="265" x2="410" y2="265" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2"/>
    <line x1="0" y1="330" x2="430" y2="330" stroke="#E3B8BF" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="300" y1="360" x2="430" y2="360" stroke="#E3B8BF" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
