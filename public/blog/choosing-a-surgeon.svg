<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Illustration of a verification seal being examined with a magnifying glass, representing vetting a surgeon's credentials">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33544C"/>
      <stop offset="50%" stop-color="#7A424C"/>
      <stop offset="100%" stop-color="#16283D"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="52%" r="58%">
      <stop offset="0%" stop-color="#0A121C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A121C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.5"/>
  <circle cx="1300" cy="200" r="220" fill="#6C8C82" opacity="0.14" filter="url(#glow)"/>
  <circle cx="220" cy="730" r="190" fill="#E3B8BF" opacity="0.12" filter="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M56,96 L56,56 L96,56"/>
    <path d="M1504,56 L1544,56 L1544,96"/>
    <path d="M56,804 L56,844 L96,844"/>
    <path d="M1544,804 L1544,844 L1504,844"/>
  </g>

  <!-- Faint profile watermark, shared motif with homepage hero -->
  <g transform="translate(940,150) scale(3.3)" opacity="0.12">
    <path d="M60,20 Q85,50 90,85 Q93,100 93,110 L108,125 L93,128 Q95,145 90,165 Q85,185 80,210"
          fill="none" stroke="#FFFFFF" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Verification seal -->
  <circle cx="740" cy="430" r="118" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4"/>
  <circle cx="740" cy="430" r="94" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="3 6"/>
  <path d="M685,432 L722,469 L800,382" fill="none" stroke="#E3B8BF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Magnifying glass inspecting the seal -->
  <circle cx="936" cy="556" r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="6"/>
  <line x1="977" y1="597" x2="1034" y2="654" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="9" stroke-linecap="round"/>
</svg>
