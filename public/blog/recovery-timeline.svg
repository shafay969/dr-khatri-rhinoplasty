<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Abstract timeline illustrating rhinoplasty recovery milestones over a year">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F332E"/>
      <stop offset="50%" stop-color="#33544C"/>
      <stop offset="100%" stop-color="#6C8C82"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#0A121C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A121C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.5"/>
  <circle cx="1300" cy="200" r="220" fill="#6C8C82" opacity="0.16" filter="url(#glow)"/>
  <circle cx="220" cy="720" r="190" fill="#0A121C" opacity="0.2" filter="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M56,96 L56,56 L96,56"/>
    <path d="M1504,56 L1544,56 L1544,96"/>
    <path d="M56,804 L56,844 L96,844"/>
    <path d="M1544,804 L1544,844 L1504,844"/>
  </g>

  <!-- Faint profile watermark, shared motif with homepage hero -->
  <g transform="translate(560,150) scale(3.3)" opacity="0.14">
    <path d="M60,20 Q85,50 90,85 Q93,100 93,110 L108,125 L93,128 Q95,145 90,165 Q85,185 80,210"
          fill="none" stroke="#FFFFFF" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Recovery timeline: swelling rings shrink as time progresses -->
  <g>
    <line x1="300" y1="560" x2="1320" y2="560" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Week 1 -->
    <circle cx="340" cy="560" r="66" fill="none" stroke="#E3B8BF" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 5"/>
    <line x1="340" y1="560" x2="340" y2="500" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="340" cy="560" r="9" fill="#FFFFFF"/>

    <!-- Weeks 2-4 -->
    <circle cx="653" cy="560" r="46" fill="none" stroke="#E3B8BF" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 5"/>
    <line x1="653" y1="560" x2="653" y2="500" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="653" cy="560" r="9" fill="#FFFFFF"/>

    <!-- Months 2-6 -->
    <circle cx="967" cy="560" r="28" fill="none" stroke="#E3B8BF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 5"/>
    <line x1="967" y1="560" x2="967" y2="500" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="967" cy="560" r="9" fill="#FFFFFF"/>

    <!-- Month 12 -->
    <circle cx="1280" cy="560" r="13" fill="none" stroke="#E3B8BF" stroke-opacity="0.28" stroke-width="2"/>
    <line x1="1280" y1="560" x2="1280" y2="500" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="1280" cy="560" r="10" fill="#E3B8BF"/>
  </g>
</svg>
