<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Line-art icons representing sleep, meals, and daily routine during rhinoplasty aftercare">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A424C"/>
      <stop offset="55%" stop-color="#16283D"/>
      <stop offset="100%" stop-color="#1F332E"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="52%" r="58%">
      <stop offset="0%" stop-color="#0A121C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A121C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.5"/>
  <circle cx="1290" cy="180" r="230" fill="#6C8C82" opacity="0.16" filter="url(#glow)"/>
  <circle cx="230" cy="750" r="190" fill="#E3B8BF" opacity="0.14" filter="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M56,96 L56,56 L96,56"/>
    <path d="M1504,56 L1544,56 L1544,96"/>
    <path d="M56,804 L56,844 L96,844"/>
    <path d="M1544,804 L1544,844 L1504,844"/>
  </g>

  <!-- Profile silhouette, shared motif with homepage hero -->
  <g transform="translate(420,110) scale(3.1)">
    <path d="M60,20 Q85,50 90,85 Q93,100 93,110 L108,125 L93,128 Q95,145 90,165 Q85,185 80,210"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Three daily-life icons: sleep (elevated pillow), meals (plate + fork), routine (sun/clock) -->
  <g transform="translate(920,240)" stroke="#E3B8BF" stroke-opacity="0.75" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- sleep: propped pillow with incline arrow -->
    <path d="M0,120 L0,90 Q0,70 30,70 L150,70 Q170,70 170,95 L170,120 Z"/>
    <path d="M0,120 L170,120" stroke-opacity="0.5"/>
    <path d="M60,45 L60,10" stroke-opacity="0.5"/>
    <path d="M48,22 L60,10 L72,22" stroke-opacity="0.5"/>
  </g>
  <line x1="920" y1="380" x2="1420" y2="380" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>

  <g transform="translate(940,420)" stroke="#E3B8BF" stroke-opacity="0.75" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- meals: plate with fork -->
    <circle cx="55" cy="55" r="52" stroke-opacity="0.55"/>
    <circle cx="55" cy="55" r="28" stroke-opacity="0.85"/>
    <path d="M140,10 L140,100" stroke-opacity="0.85"/>
    <path d="M128,10 L128,40 M140,10 L140,40 M152,10 L152,40 Q140,55 128,40" stroke-opacity="0.85"/>
  </g>
  <line x1="920" y1="560" x2="1420" y2="560" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>

  <g transform="translate(950,600)" stroke="#E3B8BF" stroke-opacity="0.75" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- daily routine: clock face -->
    <circle cx="55" cy="55" r="52" stroke-opacity="0.6"/>
    <path d="M55,25 L55,55 L78,70" stroke-opacity="0.9"/>
  </g>

  <g fill="none" stroke="#E3B8BF" stroke-dasharray="4 5">
    <circle cx="835" cy="508" r="130" opacity="0.18" stroke-width="2"/>
  </g>
</svg>
