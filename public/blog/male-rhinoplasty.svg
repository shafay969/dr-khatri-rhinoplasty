<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Line-art diagram of a strong, straight-dorsum male nasal profile with angular proportion guides">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16283D"/>
      <stop offset="55%" stop-color="#B06A76"/>
      <stop offset="100%" stop-color="#33544C"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="52%" r="58%">
      <stop offset="0%" stop-color="#0A121C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A121C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.5"/>
  <circle cx="1300" cy="190" r="230" fill="#6C8C82" opacity="0.16" filter="url(#glow)"/>
  <circle cx="230" cy="750" r="190" fill="#16283D" opacity="0.24" filter="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M56,96 L56,56 L96,56"/>
    <path d="M1504,56 L1544,56 L1544,96"/>
    <path d="M56,804 L56,844 L96,844"/>
    <path d="M1544,804 L1544,844 L1504,844"/>
  </g>

  <!-- Angular proportion guides -->
  <g stroke="#E3B8BF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="640" y1="508" x2="1030" y2="508"/>
    <line x1="835" y1="313" x2="835" y2="703"/>
  </g>
  <g fill="none" stroke="#E3B8BF" stroke-dasharray="4 5">
    <circle cx="835" cy="508" r="130" opacity="0.32" stroke-width="2"/>
    <circle cx="835" cy="508" r="195" opacity="0.18" stroke-width="2"/>
  </g>

  <!-- Straighter, stronger-dorsum profile silhouette, distinct from the softer curve used elsewhere on the site -->
  <g transform="translate(470,110) scale(3.1)">
    <path d="M56,18 Q76,42 84,72 Q90,96 92,112 L110,126 L92,130 Q94,148 88,168 Q83,188 78,212"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M56,18 L84,72" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.8" stroke-dasharray="2 3"/>
  </g>

  <!-- Angle annotation, echoing the golden-ratio diagram used across the journal -->
  <g transform="translate(1050,470)" font-family="Georgia, serif">
    <line x1="0" y1="0" x2="80" y2="-46" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>
    <line x1="0" y1="0" x2="90" y2="10" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>
    <path d="M40,-6 A46,46 0 0 1 46,18" fill="none" stroke="#E3B8BF" stroke-width="1" opacity="0.6"/>
    <text x="58" y="-14" fill="#FFFFFF" font-size="15" letter-spacing="1" opacity="0.75">~35–40°</text>
  </g>
</svg>
