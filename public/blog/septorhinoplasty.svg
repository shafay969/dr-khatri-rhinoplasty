<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Line-art diagram of a deviated nasal septum being straightened, with airflow lines through the nostril">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B06A76"/>
      <stop offset="55%" stop-color="#16283D"/>
      <stop offset="100%" stop-color="#1F332E"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="52%" r="58%">
      <stop offset="0%" stop-color="#0A121C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A121C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.5"/>
  <circle cx="1300" cy="190" r="230" fill="#E3B8BF" opacity="0.14" filter="url(#glow)"/>
  <circle cx="230" cy="750" r="190" fill="#6C8C82" opacity="0.2" filter="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M56,96 L56,56 L96,56"/>
    <path d="M1504,56 L1544,56 L1544,96"/>
    <path d="M56,804 L56,844 L96,844"/>
    <path d="M1544,804 L1544,844 L1504,844"/>
  </g>

  <!-- Profile silhouette -->
  <g transform="translate(430,110) scale(3.1)">
    <path d="M60,20 Q85,50 90,85 Q93,100 93,110 L108,125 L93,128 Q95,145 90,165 Q85,185 80,210"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Septum diagram: deviated line straightening into an upright line, with airflow arrows -->
  <g transform="translate(1000,260)">
    <line x1="90" y1="0" x2="90" y2="380" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="2 3"/>
    <path d="M40,0 Q10,90 55,170 Q95,240 30,380"
          fill="none" stroke="#E3B8BF" stroke-opacity="0.5" stroke-width="2.4" stroke-dasharray="4 5"
          stroke-linecap="round"/>
    <path d="M90,0 L90,380"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="2.6"
          stroke-linecap="round"/>
    <g stroke="#E3B8BF" stroke-opacity="0.75" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M-70,60 L20,60"/>
      <path d="M4,48 L22,60 L4,72"/>
      <path d="M-70,190 L20,190"/>
      <path d="M4,178 L22,190 L4,202"/>
      <path d="M-70,320 L20,320"/>
      <path d="M4,308 L22,320 L4,332"/>
    </g>
  </g>

  <!-- Guide rings echoing the homepage hero motif -->
  <g fill="none" stroke="#E3B8BF" stroke-dasharray="4 5">
    <circle cx="835" cy="508" r="130" opacity="0.2" stroke-width="2"/>
  </g>
</svg>
